name: Nightly clearance sweep

on:
  schedule:
    # 09:10 UTC — about 5am Eastern, so the list is fresh before the doors open.
    - cron: "10 9 * * *"
    # Sundays, an hour earlier: re-harvest the product pool first.
    - cron: "10 8 * * 0"
  workflow_dispatch:
    inputs:
      harvest:
        description: "Re-harvest the product pool before scanning"
        type: boolean
        default: false
      probe_only:
        description: "Just report what each Home Depot host does from the runner"
        type: boolean
        default: false

# One sweep at a time; a queued run would only fight over the same file.
concurrency:
  group: sweep
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sweep:
    # GitHub's hosted runners cannot do this job. Home Depot's pricing API
    # answers 206 "Generic Errors API" to every request from their address
    # range -- measured with four header variants, all four refused, while
    # the same code from a residential address gets 200. It is the IP, so
    # no header or user-agent fixes it. Point this at a self-hosted runner
    # on a home network (repo variable SWEEP_RUNNER = self-hosted) and the
    # sweep works; until then the probe step says so on every run.
    runs-on: ${{ vars.SWEEP_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Home Depot's hosts sit behind a bot filter, and whether a given
      # runner gets past it is not something the code can assume.
      - name: Can this runner reach Home Depot?
        run: python3 tools/sweep.py probe

      - name: Harvest the product pool
        if: (github.event.schedule == '10 8 * * 0' || inputs.harvest) && !inputs.probe_only
        run: python3 tools/sweep.py harvest

      # Walk the next slice of Home Depot's 4.2M-product sitemap at one
      # rotating store. Cheap per product, and anything found on clearance
      # is promoted to the hot list and priced at every store from then on.
      # Marked red when it fails but never blocks the scan: discovery only
      # widens the net, and last night's net still catches tonight's prices.
      - name: Discover
        if: ${{ !inputs.probe_only }}
        continue-on-error: true
        run: python3 tools/sweep.py discover
        env:
          SWEEP_SLICE: ${{ vars.SWEEP_SLICE || '60000' }}

      # sweep.py refuses to overwrite the list when a run comes back empty
      # or collapsed, so a bad night leaves yesterday's data in place.
      - name: Scan every store
        if: ${{ !inputs.probe_only }}
        run: python3 tools/sweep.py scan

      - name: Commit the new list
        if: ${{ !inputs.probe_only }}
        run: |
          git config user.name "penny-run-sweep"
          git config user.email "penny-run-sweep@users.noreply.github.com"
          git add pennyrun/clearance.json tools/pool.json tools/hot.json \
                  tools/cursor.json tools/prices.json
          if git diff --cached --quiet; then
            echo "nothing changed since the last sweep"
            exit 0
          fi
          hits=$(python3 -c "import json;print(len(json.load(open('pennyrun/clearance.json'))['hits']))")
          git commit -m "Sweep: ${hits} clearance items across the store list"
          # A push races the deploy workflow's own commits at most rarely,
          # but rebase-and-retry costs nothing and avoids a failed night.
          for i in 1 2 3; do
            git push && exit 0
            sleep $((i * 5))
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
          done
          exit 1
